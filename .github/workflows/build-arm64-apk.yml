name: Build XHYN IV ARM64 verification APK

on:
  push:
    branches:
      - codex/arm64-apk-build-20261108
    paths:
      - .github/workflows/build-arm64-apk.yml
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign using the owner-provisioned permanent key
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xhyn-arm64-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Compile native ARM64 and package unsigned APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: Release
      STRIP: "1"
      NDK_VER: 29.0.14206865

    steps:
      - name: Check out pinned source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Resolve signing request
        id: signing_request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SIGN_RELEASE_INPUT: ${{ toJSON(inputs.sign_release) }}
        run: |
          set -euo pipefail
          printf 'Event: %s; sign_release input: %s\n' "$EVENT_NAME" "$SIGN_RELEASE_INPUT"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            case "$SIGN_RELEASE_INPUT" in
              true) requested=true ;;
              false) requested=false ;;
              *) echo '::error::Unexpected sign_release input; refusing ambiguous dispatch'; exit 1 ;;
            esac
          else
            requested=false
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "Effective signing requested: $requested"

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test signed artifact verification
        run: python3 os/android/scripts/tests/test_verify_signed_artifact.py

      - name: Install CMake and Ninja
        run: python -m pip install 'cmake==3.31.6' 'ninja>=1.11,<2'

      - name: Initialize Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*29\.0\.14206865[[:space:]]*$' "$ndk/source.properties"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version
          df -h .

      - name: Initialize pinned repository dependencies
        run: |
          python3 tools/setup_repo.py --retry-bootstrap-transient
          python3 tools/setup_repo.py --check

      - name: Obtain pinned shader toolchain
        run: bash os/android/scripts/setup_host_tools.sh

      - name: Build ARM64 Vulkan driver proxy
        run: bash os/android/scripts/build_driver_proxy.sh

      - name: Build complete ARM64 native game runtime
        run: bash os/android/scripts/build_native.sh 2

      - name: Package and verify unsigned ARM64 APK
        run: |
          python3 os/android/scripts/package_release.py --unsigned --output out/XHYN-IV-ARM64-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging out/XHYN-IV-ARM64-unsigned.apk | grep "^package: name='com.xhyn.ivrecomp'"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path("out/XHYN-IV-ARM64-unsigned.apk")
          required = {
              "libmain.so", "libliberty_install.so", "librexruntime.so",
              "librexgpu-gta4-native.so", "librexgpu-xenos.so", "libSDL3.so",
              "libc++_shared.so", "libvulkan.so", "libmain_hook.so",
              "libhook_impl.so", "libc11_threads_compat.so",
          }
          with zipfile.ZipFile(apk) as z:
              libs = [name for name in z.namelist() if name.startswith("lib/")]
              actual = {name.rsplit("/",1)[-1] for name in libs}
              assert actual == required, f"Incorrect native lib set: {actual ^ required}"
              assert all(name.startswith("lib/arm64-v8a/") for name in libs)
              assert z.testzip() is None
          print(f"Verified unsigned ARM64 APK ({apk.stat().st_size} bytes)")
          PY
          sha256sum out/XHYN-IV-ARM64-unsigned.apk > out/XHYN-IV-ARM64-unsigned.apk.sha256

      - name: Upload APK for signing review (NOT installable)
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-IV-arm64-UNSIGNED-not-installable
          path: |
            out/XHYN-IV-ARM64-unsigned.apk
            out/XHYN-IV-ARM64-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Sign and verify with the owner-provisioned release key
        id: sign_release
        if: ${{ steps.signing_request.outputs.requested == 'true' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.XHYN_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XHYN_RELEASE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XHYN_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.XHYN_RELEASE_CERT_SHA256 }}
          PREVIOUS_CODE: ${{ vars.XHYN_PREVIOUS_RELEASE_CODE }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$EXPECTED_CERT" && test -n "$PREVIOUS_CODE" || { echo 'Release signing requirements are missing'; exit 1; }
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/xhyn-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$signing_dir/key.p12"
          printf '%s' "$KEYSTORE_PASSWORD" > "$signing_dir/password"
          unset KEYSTORE_B64 KEYSTORE_PASSWORD
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" sign --ks "$signing_dir/key.p12" --ks-key-alias "$KEY_ALIAS" --ks-pass "file:$signing_dir/password" --key-pass "file:$signing_dir/password" --out out/XHYN-IV-ARM64-signed.apk out/XHYN-IV-ARM64-unsigned.apk
          "$bt/apksigner" verify --verbose --print-certs out/XHYN-IV-ARM64-signed.apk > "$RUNNER_TEMP/xhyn-cert.txt"
          "$bt/zipalign" -c -P 16 4 out/XHYN-IV-ARM64-signed.apk
          "$bt/aapt2" dump badging out/XHYN-IV-ARM64-signed.apk > "$RUNNER_TEMP/xhyn-badging.txt"
          python3 os/android/scripts/verify_signed_artifact.py out/XHYN-IV-ARM64-unsigned.apk out/XHYN-IV-ARM64-signed.apk "$RUNNER_TEMP/xhyn-cert.txt" "$RUNNER_TEMP/xhyn-badging.txt" "$EXPECTED_CERT" "$PREVIOUS_CODE" > out/XHYN-IV-ARM64-signed-metadata.json
          cat out/XHYN-IV-ARM64-signed-metadata.json

      - name: Upload verified signed APK
        id: upload_signed
        if: ${{ steps.signing_request.outputs.requested == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: XHYN-IV-arm64-SIGNED
          path: |
            out/XHYN-IV-ARM64-signed.apk
            out/XHYN-IV-ARM64-signed-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm requested signing completed
        if: ${{ always() && steps.signing_request.outputs.requested == 'true' }}
        shell: bash
        env:
          SIGN_OUTCOME: ${{ steps.sign_release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_signed.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SIGN_OUTCOME" != success || "$UPLOAD_OUTCOME" != success ]]; then
            echo '::error::Signing was requested but the signed APK was not verified and uploaded.'
            exit 1
          fi
